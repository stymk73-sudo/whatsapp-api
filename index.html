<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp API Gateway</title>
    <style>
        body { font-family: Arial; background: #f4f7f6; text-align: center; padding: 20px; }
        .card { background: white; max-width: 350px; margin: 0 auto; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        img { width: 220px; height: 220px; }
        .status { font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>WhatsApp API Login</h2>
        <div id="qr-box"><p>Loading QR...</p></div>
        <div class="status" id="status-text">Status: Checking...</div>
        <div id="api-info" style="display: none; margin-top: 15px; text-align: left;">
            <hr>
            <p><b>API URL:</b><br><code id="api-url"></code></p>
        </div>
    </div>
    <script>
        async function check() {
            try {
                let res = await fetch('/get-qr');
                let data = await res.json();
                if (data.status === 'connected') {
                    document.getElementById('qr-box').innerHTML = '<h3>✅ Connected!</h3>';
                    document.getElementById('status-text').innerText = 'Status: Connected';
                    document.getElementById('api-url').innerText = window.location.origin + '/api/send-message';
                    document.getElementById('api-info').style.display = 'block';
                } else if (data.qr) {
                    document.getElementById('qr-box').innerHTML = `<img src="${data.qr}">`;
                    document.getElementById('status-text').innerText = 'Status: Scan QR';
                }
            } catch(e) {}
        }
        setInterval(check, 3000);
        check();
    </script>
</body>
</html>
