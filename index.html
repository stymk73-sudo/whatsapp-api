<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp API Gateway - Lite</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; text-align: center; padding: 20px; }
        .card { background: white; max-width: 350px; margin: 0 auto; padding: 20px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        #qr-box img { width: 220px; height: 220px; }
        .status { font-weight: bold; margin-top: 15px; }
        .connected { color: green; }
        .disconnected { color: red; }
    </style>
</head>
<body>
    <div class="card">
        <h2>WhatsApp API Login</h2>
        <div id="qr-box"><p>Loading QR Code...</p></div>
        <div class="status" id="status-text">Status: Checking...</div>
        <div id="api-info" style="display: none; margin-top: 15px; text-align: left;">
            <hr>
            <p><b>API URL:</b><br><code id="api-url"></code></p>
            <p><b>Method:</b> POST</p>
            <p><b>JSON Body:</b><br><code>{ "phone": "919876543210", "message": "Hello!" }</code></p>
        </div>
    </div>
    <script>
        async function check() {
            try {
                let res = await fetch('/get-qr');
                let data = await res.json();
                
                let qrBox = document.getElementById('qr-box');
                let statusText = document.getElementById('status-text');
                let apiInfo = document.getElementById('api-info');

                if (data.status === 'connected') {
                    qrBox.innerHTML = '<h3>✅ WhatsApp Connected!</h3>';
                    statusText.innerText = 'Status: Connected';
                    statusText.className = 'status connected';
                    document.getElementById('api-url').innerText = window.location.origin + '/api/send-message';
                    apiInfo.style.display = 'block';
                } else if (data.qr) {
                    qrBox.innerHTML = `<img src="${data.qr}" alt="QR">`;
                    statusText.innerText = 'Status: Scan QR in WhatsApp';
                    statusText.className = 'status disconnected';
                } else {
                    qrBox.innerHTML = '<p>QR generate ho raha hai...</p>';
                    statusText.innerText = 'Status: Waiting for QR...';
                }
            } catch(e) {
                document.getElementById('status-text').innerText = 'Status: Server se connect nahi ho pa raha!';
            }
        }
        setInterval(check, 3000);
        check();
    </script>
</body>
</html>
